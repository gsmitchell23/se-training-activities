<script type="application/json" id="activity-data">{"type": "branch", "title": "Fair treatment on shift", "intro": "Two situations on a shift. Choose what you would do.", "start": "n1", "nodes": {"n1": {"scene": "A hirer asks you to open a side entrance because a member of their group uses a wheelchair and the usual door has a step. The side entrance is safe to use, and it is not an alarmed fire exit you have been told to keep shut.", "short": "Made a reasonable adjustment safely", "choices": [{"text": "Open the side entrance for them.", "ok": true, "fb": "This is the kind of reasonable adjustment you should make if you can do so safely.", "next": "n2"}, {"text": "Refuse. Everyone uses the usual door.", "ok": false, "fb": "Do not refuse automatically. Make reasonable adjustments where you can."}, {"text": "Ask the person about their diagnosis first, in front of the group.", "ok": false, "fb": "Do not ask personal questions about someone's diagnosis in front of the group."}]}, "n2": {"scene": "Another week, you are not sure whether a door the group asks for can be used safely.", "short": "Got help instead of saying no", "choices": [{"text": "Get help from the agreed contact rather than simply saying no.", "ok": true, "fb": "If you cannot make an adjustment on the night, get help.", "next": "n3"}, {"text": "Say no and move on.", "ok": false, "fb": "Do not refuse automatically. Get help."}, {"text": "Open it anyway and hope it is fine.", "ok": false, "fb": "If you are not sure it is safe, get help rather than guessing."}], "ask": "What do you do?"}, "n3": {"scene": "A hirer makes a racist 'joke' in front of you and the group.", "short": "Stayed respectful and reported it factually", "choices": [{"text": "Do not join in, stay respectful, and report it to your manager or the office with a factual note of what you saw or heard.", "ok": true, "fb": "Report any concern about discrimination or harassment, and keep a factual note.", "next": "end"}, {"text": "Laugh along to keep the peace.", "ok": false, "fb": "You must not discriminate, and you should use respectful language at all times."}, {"text": "Say nothing to anyone. It was only a joke.", "ok": false, "fb": "Report concerns about discrimination or harassment to your manager or the office."}], "ask": "What do you do?", "tag": "Scenario 2"}, "end": {"end": true}}, "outro": "Treat people fairly, use respectful language, make reasonable adjustments where you can, and get help rather than simply saying no."}</script>
