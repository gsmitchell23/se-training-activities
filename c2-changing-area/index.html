<script type="application/json" id="activity-data">{"type": "branch", "title": "An unknown adult in the changing area", "intro": "Choose what you would do.", "start": "n1", "nodes": {"n1": {"scene": "You see an unknown adult walking into the children's changing area during a junior club session.", "short": "Challenged promptly and kept children safe", "choices": [{"text": "Challenge the situation promptly and calmly, keep the children safe, and report the concern.", "ok": true, "fb": "Get help if you feel unsafe or if they refuse to engage.", "next": "n2"}, {"text": "Ignore it. The school is a public building after 6pm.", "ok": false, "fb": "Do not ignore it."}, {"text": "Wait until lock-up and mention it only in the log.", "ok": false, "fb": "Act at the time, and report it."}, {"text": "Ask a child to tell the adult to leave.", "ok": false, "fb": "Do not put a child in that position."}]}, "n2": {"scene": "Next week, an adult-only group and a children's group are booked at the same time.", "short": "Kept groups apart where possible", "choices": [{"text": "Control access so the groups are kept apart where possible, especially in toilets and changing areas.", "ok": true, "fb": "Control corridors, toilets and changing rooms.", "next": "end"}, {"text": "Let both groups share changing rooms freely, to be flexible.", "ok": false, "fb": "Do not leave mixed changing-room use unmanaged."}, {"text": "Cancel the adult booking yourself without telling the office.", "ok": false, "fb": "Do not cancel bookings yourself. Manage the risk and escalate if needed."}, {"text": "Move the children into a classroom to change.", "ok": false, "fb": "Do not move children into an unbooked or unsuitable space on a whim."}], "ask": "What is the best approach?"}, "end": {"end": true}}, "outro": "Good site practice, such as controlling access and separating groups, is part of safeguarding."}</script>
