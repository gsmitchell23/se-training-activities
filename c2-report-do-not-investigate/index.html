<script type="application/json" id="activity-data">{"type": "branch", "title": "A child tells you something", "intro": "Work through this scenario. Choose what you would do at each point.", "start": "n1", "nodes": {"n1": {"scene": "A child tells you their coach hurt them. The child is with you in a corridor, appears safe in the moment, and asks you not to tell anyone.", "short": "Listened calmly and did not promise secrecy", "choices": [{"text": "Listen calmly. Explain that you cannot keep it a secret, but you will only tell people who need to know to keep them safe.", "ok": true, "next": "n2", "fb": "Do not promise secrecy. Listening calmly, without questioning at length, is the right start."}, {"text": "Promise to keep it a secret so the child keeps talking.", "ok": false, "fb": "Do not promise a child that you will keep it a secret."}, {"text": "Ask lots of detailed questions to find out exactly what happened.", "ok": false, "fb": "Do not question the child at length or investigate. You do not need proof; a reasonable concern is enough."}, {"text": "Go and find the coach to hear their side of the story.", "ok": false, "fb": "Do not investigate, and do not tip off the person the concern is about."}]}, "n2": {"scene": "The child has finished talking and is safe with you for now. The session is still running.", "ask": "What do you do next?", "short": "Reported straight away to the DSL and the agreed company contact", "choices": [{"text": "Report the concern immediately to the school's DSL or deputy, and also inform the agreed School Enterprises contact.", "ok": true, "next": "n3", "fb": "Report immediately. Do not wait until the next working day if a child may be at risk."}, {"text": "Wait until the next working day and mention it to your manager.", "ok": false, "fb": "Do not wait if a child may be at risk. Report it immediately."}, {"text": "Ask the hirer to deal with it, because it is their session.", "ok": false, "fb": "You must act. Do not leave it only to the hirer."}]}, "n3": {"scene": "You have reported the concern.", "ask": "What else must you do?", "short": "Recorded the facts the same day", "choices": [{"text": "Record what you saw and heard, factually, the same day.", "ok": true, "next": "n4", "fb": "A factual, same-day record helps the people who will act on the concern."}, {"text": "Write a full report at the end of the week, once you have had time to think.", "ok": false, "fb": "Record it the same day, while it is fresh."}, {"text": "Write down your own view of whether the coach is guilty.", "ok": false, "fb": "Record facts, not opinions. Deciding what happened is not your job."}]}, "n4": {"tag": "What if...", "scene": "Now imagine the child is in immediate danger.", "ask": "What do you do first?", "short": "Called 999 first when a child was in immediate danger", "choices": [{"text": "Call 999 first, then follow the reporting process.", "ok": true, "next": "end", "fb": "Immediate danger is a 999 matter first."}, {"text": "Call the office and wait for instructions, even if there is a delay.", "ok": false, "fb": "Do not delay a 999 call."}, {"text": "Drive the child home yourself.", "ok": false, "fb": "Do not take the child in your own vehicle."}]}, "end": {"end": true}}, "outro": "Listen calmly, do not investigate, and do not promise secrecy. Report immediately to the DSL and the agreed company contact. Call 999 first if a child is in immediate danger."}</script>
