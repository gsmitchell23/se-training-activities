<script type="application/json" id="activity-data">{"type": "sort", "title": "Safer practice or not acceptable?", "intro": "Sort each action. Some are meant kindly but are still poor practice.", "label": "Sort each action", "categories": ["Safer practice", "Not acceptable"], "items": [{"text": "Offering a child a lift home because their parent is late.", "answer": "Not acceptable", "why": "Do not offer lifts. Stay with the child in a public, well-lit area and contact the agreed adult or the office."}, {"text": "Speaking with a lost child in a public area, or with another adult present.", "answer": "Safer practice", "why": "Public space and another adult protect the child and you."}, {"text": "Comforting an upset child in a locked office, alone.", "answer": "Not acceptable", "why": "Avoid being alone with a child, and never in a locked room."}, {"text": "Exchanging Instagram details with a 15-year-old junior coach to send booking updates.", "answer": "Not acceptable", "why": "Do not exchange personal contact or social media details with children."}, {"text": "Keeping doors open, or staying in public areas, when a child needs help.", "answer": "Safer practice", "why": "That is the professional standard."}, {"text": "Taking a photo of a children's session on your own phone.", "answer": "Not acceptable", "why": "Do not use personal devices to photograph children."}, {"text": "Staying with a child whose parent is late, in a public, well-lit area, while you contact the agreed adult or the office.", "answer": "Safer practice", "why": "Follow the reporting process if you are worried, and call 999 if the child is at immediate risk."}], "outro": "A lift home, a private message or a closed-door conversation can be meant kindly and still be poor practice. Use public space, official routes and another adult where you can."}</script>
