<script type="application/json" id="activity-data">{"type": "branch", "title": "No supervising adult", "intro": "Choose what you would do.", "start": "n1", "nodes": {"n1": {"scene": "You open the hall for a junior club. Children are there with no supervising adult. They say their coach 'is on the way' and ask you to leave them to start warming up.", "short": "Stayed with the group in a safe, public way", "choices": [{"text": "Stay with the group in a safe, public way, and try to contact the hirer or the office.", "ok": true, "fb": "Do not leave children unsupervised.", "next": "n2"}, {"text": "Leave them to warm up. They have booked the hall.", "ok": false, "fb": "Do not leave children unsupervised."}, {"text": "Send the children home without telling anyone.", "ok": false, "fb": "Do not send children away without following the reporting process."}]}, "n2": {"scene": "The coach still has not arrived.", "short": "Reported the unsupervised session", "choices": [{"text": "Report the concern, because the session is unsupervised and a child may be at risk.", "ok": true, "fb": "Report to the office and, if a child may be at risk, to the DSL.", "next": "n3"}, {"text": "Cancel all of the club's future bookings on the spot.", "ok": false, "fb": "Do not cancel future bookings yourself. Report the concern."}], "ask": "What else do you do?"}, "n3": {"scene": "Another week, a hirer refuses to follow a site rule that is there to keep children safe.", "short": "Reported a refusal to follow a safety rule", "choices": [{"text": "Report it to the office and, if a child may be at risk, to the DSL.", "ok": true, "fb": "Do not let it pass.", "next": "end"}, {"text": "Ignore the refusal so as not to lose the booking.", "ok": false, "fb": "Do not ignore a safeguarding rule to keep a booking."}, {"text": "Argue with the hirer in front of the children until they give in.", "ok": false, "fb": "Stay calm. Do not have a row in front of the children."}, {"text": "Change the rule for that evening
