hoices": [{"text": "The Local Authority Designated Officer (LADO), through the school, not by informal conversation.", "ok": true, "fb": "The LADO is involved when there is an allegation or concern about a person who works with children.", "next": "end"}, {"text": "Sort it out with an informal word with the person.", "ok": false, "fb": "That route is handled through the school and the LADO."}], "ask": "Which route is involved?"}, "end": {"end": true}}, "outro": "Your manager will confirm each site's DSL details and the exact fallback. Keep them to hand before you need them."}</script>
